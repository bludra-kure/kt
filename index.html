<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Společný odpočet 20 minut</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1.5rem;
      background: #f0f4f8;
      color: #1a202c;
    }
    h1 { margin-bottom: 0.3rem; }
    #status {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    #timer {
      font-size: clamp(3.8rem, 14vw, 6.5rem);
      font-weight: 700;
      margin: 1rem 0 1.5rem;
      font-variant-numeric: tabular-nums;
    }
    .running  { color: #2b6cb0; }
    .paused   { color: #d69e2e; }
    .finished { color: #c53030; }
    .idle     { color: #4a5568; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
    }
    button {
      font-size: 1.15rem;
      padding: 0.8rem 1.4rem;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      min-width: 130px;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-start { background: #38a169; }
    #btn-pause { background: #d69e2e; }
    #btn-reset { background: #e53e3e; }

    .note {
      margin-top: 2.5rem;
      font-size: 0.95rem;
      color: #718096;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h1>Odpočet 20 minut</h1>
  <div id="status">Načítám…</div>
  <div id="timer" class="idle">20:00</div>

  <div class="controls">
    <button id="btn-start" onclick="start()">Spustit</button>
    <button id="btn-pause" onclick="pause()" disabled>Pozastavit</button>
    <button id="btn-reset" onclick="reset()">Reset</button>
  </div>

  <p class="note">
    Otevřete tuto stránku na obou zařízeních.<br>
    Vzdálený pracovník ovládá tlačítka.<br>
    Supervizor vidí živý stav a dostane upozornění.
  </p>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script>
    // ========== PASTE YOUR FIREBASE CONFIG HERE ==========
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "firebase/app";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries
    
    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC0xpeI3X5CNHv058zFrtWASfYkE0uXEhw",
      authDomain: "ktec-ef13a.firebaseapp.com",
      databaseURL: "https://ktec-ef13a-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ktec-ef13a",
      storageBucket: "ktec-ef13a.firebasestorage.app",
      messagingSenderId: "908850423598",
      appId: "1:908850423598:web:fb5af9d073b9a2cf8ebcbf"
    };
    
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    // ======================================================

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const ref = db.ref("countdown");

    const DURATION = 20 * 60; // 20 minutes
    let localInterval = null;

    const timerEl  = document.getElementById("timer");
    const statusEl = document.getElementById("status");
    const btnStart = document.getElementById("btn-start");
    const btnPause = document.getElementById("btn-pause");

    // ---------- helpers ----------
    function format(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, "0");
      const s = (sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function playBeep(times = 1) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < times; i++) {
          setTimeout(() => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = 880;
            g.gain.setValueAtTime(0.25, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
            o.start(); o.stop(ctx.currentTime + 0.35);
          }, i * 450);
        }
      } catch(e) {}
    }

    function notify(title, body) {
      if (Notification.permission === "granted") {
        new Notification(title, { body, requireInteraction: true });
      }
    }

    // ---------- update UI from cloud state ----------
    function render(state) {
      if (!state) return;

      const remaining = state.remaining ?? DURATION;
      const status    = state.status || "idle";

      timerEl.textContent = format(remaining);
      timerEl.className = status;

      if (status === "running") {
        statusEl.textContent = "Běží…";
        btnStart.disabled = true;
        btnPause.disabled = false;
        btnPause.textContent = "Pozastavit";
      } else if (status === "paused") {
        statusEl.textContent = "Pozastaveno";
        btnStart.disabled = false;
        btnPause.disabled = true;
        btnPause.textContent = "Pozastavit";
      } else if (status === "finished") {
        statusEl.textContent = "Hotovo!";
        btnStart.disabled = false;
        btnPause.disabled = true;
      } else {
        statusEl.textContent = "Připraveno";
        btnStart.disabled = false;
        btnPause.disabled = true;
      }
    }

    // ---------- cloud actions ----------
    function start() {
      ref.transaction(current => {
        const now = Date.now();
        const remaining = (current && current.remaining > 0) ? current.remaining : DURATION;
        return {
          status: "running",
          remaining: remaining,
          endTime: now + remaining * 1000,
          lastUpdate: now
        };
      });
      notify("Odpočet spuštěn", "Vzdálený pracovník spustil odpočet.");
      playBeep(1);
    }

    function pause() {
      ref.transaction(current => {
        if (!current || current.status !== "running") return current;
        const remaining = Math.max(0, Math.round((current.endTime - Date.now()) / 1000));
        return {
          status: "paused",
          remaining: remaining,
          endTime: null,
          lastUpdate: Date.now()
        };
      });
      notify("Odpočet pozastaven", "Odpočet byl pozastaven.");
    }

    function reset() {
      ref.set({
        status: "idle",
        remaining: DURATION,
        endTime: null,
        lastUpdate: Date.now()
      });
      notify("Odpočet resetován", "Odpočet byl vynulován.");
    }

    // ---------- live listener ----------
    ref.on("value", snapshot => {
      const state = snapshot.val();
      render(state);

      // Local countdown ticker only while running
      clearInterval(localInterval);
      if (state && state.status === "running" && state.endTime) {
        localInterval = setInterval(() => {
          const left = Math.max(0, Math.round((state.endTime - Date.now()) / 1000));
          timerEl.textContent = format(left);

          if (left <= 0) {
            clearInterval(localInterval);
            // Mark as finished (only one device will succeed)
            ref.transaction(curr => {
              if (curr && curr.status === "running") {
                return { status: "finished", remaining: 0, endTime: null, lastUpdate: Date.now() };
              }
              return curr;
            });
            notify("Čas vypršel!", "Proveďte následný úkol.");
            playBeep(3);
          }
        }, 250);
      }
    });

    // Ask for notification permission
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
  </script>
</body>
</html>
